[package]
name = "rex-launch"
version = "0.1.0"
edition = "2024"
description = "A composer popup for Rex that starts a coding agent in a new git worktree"
repository = "https://github.com/nicosuave/rex-launch"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
